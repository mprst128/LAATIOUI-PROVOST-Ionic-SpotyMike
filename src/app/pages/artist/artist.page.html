<ion-content [fullscreen]="true">
  <ion-row class="container">
    <ion-icon (click)="backClicked()" class="iconHeader" name="chevronBack" color="black"></ion-icon>
    <p id="title">Artist List</p>
    <ion-icon class="iconHeader" name="ellipsis-horizontal"></ion-icon>
  </ion-row>
<div>
  <div class="padding-container">
      <div>
        <ion-row (click)="goToOneArtist()" >
          <img class="reformat-cover" src="assets/icon/theweeknd1.png" alt="The Weeknd">
          <div class="padding-text">
            <p class="bold playlist-text">The Weeknd</p>
          </div>
            <ion-icon class="ellipsis" name="ellipsis-horizontal"></ion-icon>
            <ion-col class="buttons-likeandshare">
              <a class="btn-like" color="transparent" href="">
                <img (click)="goToFavorites()" class="reformat-like" src="assets/icon/likeSomething.svg">
              </a>
              <a class="btn-share" color="transparent" href="">
                <img class="reformat-share" src="assets/icon/shareSomething.svg">
              </a>
            </ion-col>
          <div class="line"></div>
        </ion-row>
      </div>
  </div>
</div>
